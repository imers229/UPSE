version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: sieg-l-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-siegl_db}
      POSTGRES_USER: ${POSTGRES_USER:-siegl_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-siegl_password_secure}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./config/postgres/schema.sql:/docker-entrypoint-initdb.d/02-schema.sql
    networks:
      - sieg-l-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-siegl_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Mosquitto MQTT Broker
  mosquitto:
    image: eclipse-mosquitto:2-alpine
    container_name: sieg-l-mosquitto
    ports:
      - "${MOSQUITTO_PORT:-1883}:1883"
      - "${MOSQUITTO_WS_PORT:-9001}:9001"
    volumes:
      - ./config/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_logs:/mosquitto/log
    networks:
      - sieg-l-network
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-h", "localhost", "-t", "$SYS/broker/clients/connected"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Node-RED
  node-red:
    image: nodered/node-red:latest
    container_name: sieg-l-node-red
    environment:
      NODE_RED_ENABLE_PROJECTS: "false"
      TZ: ${TZ:-UTC}
    ports:
      - "${NODE_RED_PORT:-1880}:1880"
    volumes:
      - node-red_data:/data
      - ./config/node-red/settings.js:/data/settings.js
    networks:
      - sieg-l-network
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1880/"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # Optional: pgAdmin for PostgreSQL Management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sieg-l-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@siegl.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin_password}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - sieg-l-network
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  mosquitto_data:
    driver: local
  mosquitto_logs:
    driver: local
  node-red_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  sieg-l-network:
    driver: bridge
